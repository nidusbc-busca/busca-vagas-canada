name: Busca Diaria de Vagas Canada

on:
  schedule:
    - cron: '0 15 * * *'  # Roda automaticamente todos os dias
  workflow_dispatch:      # Permite rodar manualmente a qualquer momento

jobs:
  run-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4

      - name: Executar busca Telecom e enviar E-mail
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python busca_vagas.py

      - name: Executar busca Driver Class 4 e enviar E-mail
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python busca_vagas_driver.py
