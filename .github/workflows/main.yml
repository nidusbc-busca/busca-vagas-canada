name: Busca Diaria de Vagas Canada

on:
  schedule:
    - cron: '0 15 * * *' # Executa diariamente às 08:00 AM PST (15:00 UTC)
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  run-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4

      - name: Executar busca e enviar E-mail
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python busca_vagas.py
